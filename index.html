    <!--
      Contraparte do redirect em public/404.html: se a URL veio de um
      "?/caminho" reescrito pelo 404.html, restaura a URL original via
      history.replaceState antes do React Router montar as rotas.
      Baseado em https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
